[project]
name = "digital-lab-coach"
version = "0.1.2.3"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.102.0",
    "fastapi>=0.115.0",
    "lxml>=6.1.0",
    "networkx>=3.6.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.50.0",
    "matplotlib>=3.11.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: long-running Digital.jar integration tests; deselected by default, run with -m slow",
]
